# The whole stack from nothing: the data layer patchbay reads (LibreNMS,
# Oxidized, MariaDB, Redis) plus patchbay itself. Use this when you don't
# already run those tools; if you do, the smaller docker-compose.example.yml
# runs patchbay alone against your existing instances.
#
#   mkdir -p data oxidized
#   cp .env.example data/.env        # patchbay's config — fill in as you go
#   sudo chown -R 10001:10001 data && sudo chmod 600 data/.env   # uid 10001; .env private
#   (edit it afterward with: sudoedit data/.env)
#   printf 'TZ=UTC\nMYSQL_PASSWORD=%s\n' "$(openssl rand -hex 16)" > .env
#   docker compose -f docker-compose.stack.yml up -d
#
# Then walk through docs/deployment.md: create the LibreNMS admin, onboard
# your devices, generate an API token, and point data/.env at the
# containers. patchbay's UI is on http://localhost:8013, LibreNMS on :8000.
#
# Two env files, two audiences: ./.env (beside this file) is read by docker
# compose itself and holds TZ and MYSQL_PASSWORD; ./data/.env is patchbay's
# site configuration, read inside the container. They never share keys.

services:
  db:
    image: mariadb:10.11
    command:
      - --innodb-file-per-table=1
      - --lower-case-table-names=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=librenms
      - MYSQL_USER=librenms
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - TZ=${TZ:-UTC}
    volumes:
      - dbdata:/var/lib/mysql
    restart: always

  redis:
    image: redis:7-alpine
    environment:
      - TZ=${TZ:-UTC}
    restart: always

  librenms:
    image: librenms/librenms:latest
    depends_on: [db, redis]
    ports:
      - "8000:8000"
    environment:
      - TZ=${TZ:-UTC}
      - PUID=1000
      - PGID=1000
      - DB_HOST=db
      - DB_NAME=librenms
      - DB_USER=librenms
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_TIMEOUT=60
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    volumes:
      - lnms_data:/data
    restart: always

  # LibreNMS's poller/discovery workers run in a sidecar sharing the same
  # image and data volume
  dispatcher:
    image: librenms/librenms:latest
    depends_on: [librenms, db, redis]
    environment:
      - TZ=${TZ:-UTC}
      - PUID=1000
      - PGID=1000
      - DB_HOST=db
      - DB_NAME=librenms
      - DB_USER=librenms
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_TIMEOUT=60
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - SIDECAR_DISPATCHER=1
      - DISPATCHER_NODE_ID=dispatcher-1
    volumes:
      - lnms_data:/data
    restart: always

  oxidized:
    image: oxidized/oxidized:latest
    environment:
      - TZ=${TZ:-UTC}
    ports:
      # patchbay reaches Oxidized as http://oxidized:8888 over the compose
      # network, so it needs no published port. This one is for debugging
      # from the host only, and binds to localhost on purpose: oxidized-web
      # has no auth, and config history is your network's insides. Delete
      # the block, or put an authenticating reverse proxy in front, before
      # exposing it further.
      - "127.0.0.1:8888:8888"
    volumes:
      # holds config, router.db, and repo/ — the git history of every device
      # config. Backed by a bind mount so it's visible and easy to back up;
      # docs/deployment.md covers the two files you create in it.
      - ./oxidized:/home/oxidized/.config/oxidized
    restart: always

  patchbay:
    image: ghcr.io/dsmorgan/patchbay:latest   # or build: { context: . } from a checkout
    ports:
      - "8013:8080"
    environment:
      # Not cosmetic: PATCHBAY_SNAPSHOT_AT is compared against the
      # container's local time, so without TZ a nightly "03:30" fires at
      # 03:30 UTC.
      - TZ=${TZ:-UTC}
      # how stale /healthz tolerates the poller being: three of these
      - PATCHBAY_POLL_INTERVAL=${PATCHBAY_POLL_INTERVAL:-}
    volumes:
      - ./data:/data                          # .env + patchbay.db live here
    # Reports, never restarts: compose leaves an unhealthy container running.
    # /healthz answers 503 when the poller has not finished a poll in three
    # poll intervals, so `docker ps` shows (unhealthy) when polling stops.
    # urlopen raises on a 503, which is what fails the check. The probe
    # connects to 127.0.0.1, which PATCHBAY_ALLOWED_HOSTS always allows. Change
    # the port to match --port under host networking, and the scheme to
    # https if PATCHBAY_TLS=direct (the probe must then skip verification).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  patchbay-poller:
    image: ghcr.io/dsmorgan/patchbay:latest   # same image, different command
    # Wait for LibreNMS before the FIRST poll, then give up and poll anyway.
    # LibreNMS needs a few minutes of database work on a cold start before
    # it listens, so without this the first cycle always logs
    # "[fail] librenms: Connection refused" — harmless but noisy, and a
    # failure that is always there is a failure nobody reads.
    # Deliberately NOT depends_on: {condition: service_healthy}: that would
    # block the poller until LibreNMS is healthy, so a genuinely broken
    # LibreNMS would also stop every other source from being collected —
    # one outage becoming a blackout. The bound is the point: wait for the
    # common case, never depend on it. `--wait` is that bound: it checks
    # librenms:8000 every 5 seconds for up to 5 minutes, then polls anyway.
    # `patchbay poller` polls, sleeps PATCHBAY_POLL_INTERVAL, and repeats, and
    # exits within a second of SIGTERM between polls. A stop during a poll lets
    # it finish, so stop_grace_period covers a long one; a second signal aborts.
    command: ["patchbay", "poller", "--wait", "librenms:8000"]
    stop_grace_period: 1m
    environment:
      - TZ=${TZ:-UTC}
      - PATCHBAY_POLL_INTERVAL=${PATCHBAY_POLL_INTERVAL:-}   # empty = 300
    volumes:
      - ./data:/data
    restart: always

volumes:
  dbdata:
  lnms_data:
