# Example patchbay deployment: web UI + background poller from one image.
#
#   mkdir -p data && cp .env.example data/.env   # then fill in what you run
#   sudo chown -R 10001:10001 data && sudo chmod 600 data/.env   # uid 10001; .env private
#   (edit it afterward with: sudoedit data/.env)
#   docker compose -f docker-compose.example.yml up -d
#
# The UI is then on http://localhost:8013. With an empty data/.env everything
# still starts and every page renders; the dashboard tells you what to
# configure. patchbay.db is created in ./data on first run.
#
# Two env files, two audiences: data/.env configures patchbay itself and is
# read inside the container. The ${...} values below are substituted by docker
# compose before the container starts, so it reads them from your shell or
# from a .env beside this file — never from data/.env:
#
#   TZ                      container local time (see PATCHBAY_SNAPSHOT_AT)
#   GIT_SHA                 build stamp shown in the UI header
#   PATCHBAY_POLL_INTERVAL  seconds between polls (default 300)
#
# Deployment principle: run this on a host OUTSIDE the failure domain
# patchbay monitors. A map of the network is worth most when the network is
# broken, which is exactly when a VM on the affected fabric is unreachable.

services:
  patchbay:
    image: ghcr.io/dsmorgan/patchbay:latest   # latest release; or swap for build: below
    # build:
    #   context: .
    #   args:
    #     GIT_SHA: "${GIT_SHA:-dev}"

    # Default: bridge networking with an explicit port mapping.
    ports:
      - "8013:8080"

    # Alternative (Linux only): host networking. Use when patchbay needs to
    # reach devices on your LAN that the Docker bridge cannot route to (e.g.
    # OPNsense, UniFi controllers, LibreNMS on a private VLAN). With host
    # networking the ports: block above is ignored; the app binds directly to
    # the host. Override the listen port via the command below if 8080 conflicts.
    #
    # network_mode: host
    # command: patchbay web --host 0.0.0.0 --port 8013
    environment:
      # Not cosmetic: PATCHBAY_SNAPSHOT_AT is compared against the container's
      # local time, so without this a nightly "03:30" fires at 03:30 UTC.
      - TZ=${TZ:-UTC}
      # how stale /healthz tolerates the poller being: three of these
      - PATCHBAY_POLL_INTERVAL=${PATCHBAY_POLL_INTERVAL:-}
    volumes:
      - ./data:/data  # .env + patchbay.db live here
    # Reports, never restarts: compose leaves an unhealthy container running.
    # /healthz answers 503 when the poller has not finished a poll in three
    # poll intervals, so `docker ps` shows (unhealthy) when polling stops.
    # urlopen raises on a 503, which is what fails the check. The probe
    # connects to 127.0.0.1, which PATCHBAY_ALLOWED_HOSTS always allows. Change
    # the port to match --port under host networking, and the scheme to
    # https if PATCHBAY_TLS=direct (the probe must then skip verification).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  patchbay-poller:
    image: ghcr.io/dsmorgan/patchbay:latest   # same image, different command
    # build:
    #   context: .
    #   args:
    #     GIT_SHA: "${GIT_SHA:-dev}"
    # `patchbay poller` polls, sleeps PATCHBAY_POLL_INTERVAL, and repeats, and
    # exits within a second of SIGTERM between polls. A stop during a poll lets
    # it finish, so stop_grace_period covers a long one; a second signal aborts.
    command: ["patchbay", "poller"]
    stop_grace_period: 1m

    # network_mode: host   # uncomment alongside the web service if using host networking

    environment:
      - TZ=${TZ:-UTC}
      - PATCHBAY_POLL_INTERVAL=${PATCHBAY_POLL_INTERVAL:-}   # empty = 300
    volumes:
      - ./data:/data
    restart: unless-stopped
