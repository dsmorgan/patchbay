<style>
  /* IBM Plex Sans, variable weight, Latin subset, self-hosted (SIL OFL 1.1 —
     see NOTICE). One variable file buys a 400/450/520/600 ladder, which is
     what lets hierarchy be carried by weight instead of brightness: on a dark
     ground, brightening spends the little contrast there is; a heavier weight
     costs none. The snapshot inlines the file as a data URI so it looks like
     the live app with the network down. */
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("{{ font_url | default('/static/fonts/ibm-plex-sans-latin-var.woff2') }}") format("woff2-variations");
    font-weight: 100 700; font-style: normal; font-display: block;
  }
  :root {
    --bg: #12191b; --card: #1a2326; --ink: #dde6e8; --muted: #8fa0a5;
    --line: #2b383c; --accent: #4db8c2; --accent2: #c792ea;
    --ok: #55b380; --warn: #cfa049; --crit: #d4715c;
    /* role palette — hues deliberately distinct from the status colors */
    --r-switch: #4db8c2; --r-firewall: #c792ea; --r-hyp: #82aaff; --r-ap: #d16ba5;
    --r-router: #dd9046;
    /* tones of the neutrals above, not new hues. --ink2 is a heading one
       step under body ink; --hover and --selected are the two lightness
       steps a rail entry climbs; --grid is the faint rule between cells, so
       a cell rule, a panel edge (--line) and a region boundary stop weighing
       the same. Chrome (header, rail) sits on --bg; content sits on --card. */
    --ink2: #b7c3c6; --hover: #1e292c; --selected: #243135; --grid: #222d30;
    --font-ui: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, Menlo, Consolas, monospace;
    /* the rail is one width and a handful of switches, so its collapsed
       state — html.rail-collapsed, or any viewport too narrow for labels —
       is the same rail with different values, not a second set of rules */
    --rail-w: 172px; --when-wide: block; --when-narrow: none;
    /* labels animate (issue #21): width/opacity/visibility instead of
       display, so the collapse can slide rather than snap */
    --rail-label-max: 12rem; --rail-label-o: 1; --rail-label-vis: visible;
    --rail-gap: 0.55rem;
    --rail-heading-pad: 0.3rem 0.5rem 0.25rem; --rail-heading-h: auto;
    --rail-tab-pad: 0.36rem 0.6rem 0.36rem 0.5rem; --rail-tab-justify: flex-start;
    --rail-indent: 6px; --rail-top-justify: flex-end;
  }
  html.rail-collapsed {
    --rail-w: 54px; --when-wide: none; --when-narrow: block;
    --rail-label-max: 0px; --rail-label-o: 0; --rail-label-vis: hidden;
    --rail-gap: 0;
    --rail-heading-pad: 0; --rail-heading-h: 6px;
    --rail-tab-pad: 0.42rem 0; --rail-tab-justify: center;
    --rail-indent: 0; --rail-top-justify: center;
  }
  @media (max-width: 640px) {
    :root {
      --rail-w: 54px; --when-wide: none; --when-narrow: block;
      --rail-label-max: 0px; --rail-label-o: 0; --rail-label-vis: hidden;
      --rail-gap: 0;
      --rail-heading-pad: 0; --rail-heading-h: 6px;
      --rail-tab-pad: 0.42rem 0; --rail-tab-justify: center;
      --rail-indent: 0; --rail-top-justify: center;
    }
    .rail .rail-toggle { display: none; }  /* nothing to toggle: too narrow for labels */
    .rail .rail-pin { display: none; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 var(--font-ui); }
  button, input, select, textarea { font-family: inherit; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* ---- the shell: header across the top, rail down the left, page beside it.
     The body scrolls (so a reload — every page refreshes itself — lands
     where it left off); the rail sticks inside its full-height column. ---- */
  body.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr);
               grid-template-rows: auto minmax(0, 1fr); min-height: 100vh; }
  body.shell > header { grid-column: 1 / -1; }
  body.shell > main { grid-column: 2; grid-row: 2; width: 100%; min-width: 0; }
  header { display: flex; align-items: baseline; gap: 1rem; padding: 0.7rem 1.1rem;
           border-bottom: 1px solid var(--line); background: var(--bg); }
  header h1 { font-size: 1.1rem; margin: 0; letter-spacing: 0.02em;
              display: flex; align-items: center; white-space: nowrap; }
  header h1 a { display: inline-flex; align-items: center; color: var(--ink); }
  header h1 a:hover { text-decoration: none; }
  /* both cords keep their own color on hover — recoloring would throw away
     the one thing the mark says, which is that these are two cables */
  header h1 a:hover .mark { filter: brightness(1.18); }
  header h1 .ver { color: var(--muted); font-size: 0.68rem; font-weight: 400;
                   margin-left: 0.4rem; font-family: var(--font-mono); }
  /* the mark: two five-port panels, cross-patched with two cords */
  .mark { height: 30px; width: auto; flex: none; margin-right: 0.5rem;
          transition: filter 0.15s; }
  .mk-panel { fill: var(--line); }
  .mk-port { fill: var(--bg); }
  .mk-cord-a, .mk-cord-b, .mk-case { fill: none; stroke-width: 2.1;
                                     stroke-linecap: round; }
  .mk-cord-a { stroke: var(--accent); }
  .mk-plug-a { fill: var(--accent); }
  .mk-cord-b { stroke: var(--accent2); }
  .mk-plug-b { fill: var(--accent2); }
  /* background-colored casing under the crossing cord, so it reads as
     passing over rather than merging into the one beneath it */
  .mk-case { stroke: var(--bg); stroke-width: 4.3; }
  header .ages { margin-left: auto; color: var(--muted); font-size: 0.75rem;
                 font-family: var(--font-mono); display: flex;
                 align-items: center; gap: 0.7rem; }
  header .ages .stale { color: var(--warn); }
  /* the operator's own hold: a pill beside the age, green-dotted while it
     will reload on the next poll, hollow when parked */
  .autoref { font: 600 0.68rem var(--font-ui); letter-spacing: 0.04em;
             color: var(--muted); background: none; cursor: pointer;
             border: 1px solid var(--line); border-radius: 999px;
             padding: 0.14rem 0.6rem 0.14rem 0.5rem;
             display: inline-flex; align-items: center; gap: 0.4rem; }
  .autoref::before { content: ""; width: 7px; height: 7px; border-radius: 50%;
                     border: 1px solid var(--muted); }
  .autoref[aria-pressed="true"] { color: var(--ink2); border-color: var(--line); }
  .autoref[aria-pressed="true"]::before { background: var(--ok);
                                          border-color: var(--ok); }
  .autoref:hover { background: var(--hover); color: var(--ink); }
  /* a destructive action styled like a link, not a pill — table rows hold
     these (delete a snapshot, delete a config revision) */
  button.linkbtn { background: none; border: 0; padding: 0; font: inherit;
                   color: var(--crit); cursor: pointer; }
  button.linkbtn:hover { text-decoration: underline; }
  /* ---- the rail: pages grouped by the question they answer (web.py NAV).
     Headings sit a level above their entries and look it — brighter, and set
     off by a rule rather than a gap. The selected marker is one edge, not an
     outline: a column of outlined pills reads as separate controls rather
     than one list of places. Collapsed, it is the same rail narrower —
     labels move into the hover title, headings become their rule. ---- */
  .rail { grid-column: 1; grid-row: 2; min-width: 0; background: var(--bg);
          border-right: 1px solid var(--line); }
  .rail-stick { position: sticky; top: 0; max-height: 100vh;
                overflow-y: auto; overflow-x: hidden;
                display: flex; flex-direction: column; gap: 1px;
                padding: 0.45rem 0.45rem 0.7rem 0.55rem; }
  .rail-top { display: flex; justify-content: var(--rail-top-justify); padding: 0 2px 4px 0; }
  .rail-chevron { display: inline-flex; padding: 3px; border: 0; border-radius: 6px;
                  background: none; color: var(--muted); cursor: pointer; }
  .rail-chevron:hover { color: var(--ink); background: var(--hover); }
  .rail-heading { padding: var(--rail-heading-pad); height: var(--rail-heading-h);
                  overflow: hidden; color: var(--ink2); font-size: 0.64rem;
                  font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .rail-heading-text { display: block; overflow: hidden; white-space: nowrap;
                       max-width: var(--rail-label-max);
                       opacity: var(--rail-label-o); visibility: var(--rail-label-vis); }
  .rail-group, .rail-foot { display: flex; flex-direction: column; gap: 1px; }
  .rail-group + .rail-group, .rail-foot { margin-top: 8px; padding-top: 8px;
                                         border-top: 1px solid var(--grid); }
  .rail-group .rail-tab { margin-left: var(--rail-indent); }
  .rail-tab { display: flex; align-items: center; justify-content: var(--rail-tab-justify);
              gap: var(--rail-gap); padding: var(--rail-tab-pad);
              border: 0; border-left: 2px solid transparent; border-radius: 6px;
              background: none; color: var(--muted); font: 600 0.8rem/1.3 var(--font-ui);
              text-align: left; white-space: nowrap; overflow: hidden; cursor: pointer; }
  .rail-tab:hover { color: var(--ink); background: var(--hover); text-decoration: none; }
  .rail-tab.on { color: var(--ink); background: var(--selected); border-left-color: var(--accent); }
  /* a hair under the label's ink, so a column of glyphs doesn't outweigh a
     column of words; the selected one comes up with the rest of the row */
  .rail-icon { flex: none; width: 16px; height: 16px; opacity: 0.85; }
  .rail-tab.on .rail-icon, .rail-tab:hover .rail-icon, .rail-chevron .rail-icon { opacity: 1; }
  .rail-label { display: block; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; max-width: var(--rail-label-max);
                opacity: var(--rail-label-o); visibility: var(--rail-label-vis); }
  /* pin only exists while there are labels to keep; pinned = accent */
  html.rail-collapsed .rail-pin { display: none; }
  .rail-pin[aria-pressed="true"] { color: var(--accent); }
  .when-wide { display: var(--when-wide); }
  .when-narrow { display: var(--when-narrow); }
  /* the collapse slides instead of snapping — skipped, not slowed, when the
     viewer prefers reduced motion */
  @media (prefers-reduced-motion: no-preference) {
    body.shell { transition: grid-template-columns 0.18s ease; }
    .rail-tab { transition: gap 0.18s ease; }
    .rail-label, .rail-heading-text {
      transition: max-width 0.18s ease, opacity 0.12s ease, visibility 0.18s; }
  }
  main { padding: 1.2rem 1.4rem 3rem; max-width: 1200px; margin: 0 auto; }
  /* filter chips: /alerts and the aggregate views (#26,#28). Filtered state
     always lives in the URL, so a chip is a link, not a control. */
  .filters { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center;
             margin: 0 0 1rem; }
  .fgroup { display: inline-flex; gap: 0.4rem; margin-left: 0.6rem;
            padding-left: 1rem; border-left: 1px solid var(--grid); }
  /* ---- filter chips: THE boolean display toggle (#36). An <a class="fchip">
     where the state lives in the URL (alerts, aggregate pages); a
     <button class="fchip" aria-pressed> where it lives in client state (the
     maps). `.on` marks active; crit/warn tint by severity. The header's
     .autoref pill is the action-chip cousin — it triggers rather than
     filters, and keeps its status dot. Mutually exclusive modes stay a
     segmented control (.grp.modes radios), not chips. ---- */
  .fchip { font-size: 0.78rem; padding: 0.12rem 0.7rem; border-radius: 999px;
           border: 1px solid var(--line); color: var(--muted); }
  button.fchip { background: none; cursor: pointer;
                 font: inherit; font-size: 0.78rem; }
  .fchip:hover { text-decoration: none; background: var(--hover); }
  .fchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fchip.on { color: var(--ink); border-color: var(--accent); }
  .fchip.crit { color: var(--crit); }
  .fchip.warn { color: var(--warn); }
  .fchip.crit.on { border-color: var(--crit); }
  .fchip.warn.on { border-color: var(--warn); }
  /* ---- page header: the question this page answers, and its controls. Title
     and purpose come from NAV (web.py), so the rail tooltip and the page say
     the same thing; a breadcrumb appears only on drill-downs. ---- */
  .page { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.25rem 1rem;
          padding-bottom: 0.7rem; margin-bottom: 0.9rem; border-bottom: 1px solid var(--grid); }
  .page h1 { font-size: 1.05rem; font-weight: 650; margin: 0; letter-spacing: 0.01em; }
  .page .purpose { color: var(--muted); font-size: 0.82rem; margin: 0; flex: 1 1 24ch; }
  .page .controls { margin-left: auto; display: flex; align-items: center; gap: 0.8rem;
                    font-size: 0.8rem; }
  .page .controls:empty { display: none; }
  .page .breadcrumb { flex-basis: 100%; color: var(--muted); font-size: 0.75rem; }
  .page .breadcrumb a { color: var(--muted); }
  .page + h2 { margin-top: 0.4rem; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em;
       color: var(--muted); margin: 1.6rem 0 0.6rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.7rem; }
  /* elevation on a dark ground is a lightness step plus a rim-light on the
     top edge; a drop shadow under --card on --bg is invisible */
  .card { background: var(--card); border: 1.4px solid var(--line); border-radius: 8px;
          padding: 0.7rem 0.9rem; position: relative;
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04); }
  .card .name { font-weight: 600; }
  .card .sub { color: var(--muted); font-size: 0.8rem; }
  /* role-framed cards echo the topology node boxes */
  .card.switch { border-color: var(--r-switch); }
  .card.router { border-color: var(--r-router); }
  .card.firewall { border-color: var(--r-firewall); }
  .card.hypervisor { border-color: var(--r-hyp); }
  .card.ap { border-color: var(--r-ap); }
  .card.unmanaged-switch { border-style: dashed; }
  .card .cicon { position: absolute; top: 0.75rem; right: 0.9rem;
                 width: 18px; height: 18px; }
  .card.switch .cicon { color: var(--r-switch); }
  .card.router .cicon { color: var(--r-router); }
  .card.firewall .cicon { color: var(--r-firewall); }
  .card.hypervisor .cicon { color: var(--r-hyp); }
  .card.ap .cicon { color: var(--r-ap); }
  .card .cicon { color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
         margin-right: 0.45rem; vertical-align: baseline; }
  .up { background: var(--ok); } .down { background: var(--crit); }
  .unknown, .disabled, .notResponding { background: var(--warn); }
  /* rule tiers: the header row keeps the panel-edge weight, cell rules drop
     to the faint one, so a table reads as one region with rows in it */
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 0.72rem;
       text-transform: uppercase; letter-spacing: 0.08em; padding: 0.35rem 0.8rem 0.35rem 0;
       border-bottom: 1px solid var(--line); }
  td { padding: 0.35rem 0.8rem 0.35rem 0; border-bottom: 1px solid var(--grid); }
  .mono { font-family: var(--font-mono); font-size: 0.8rem; }
  .muted { color: var(--muted); }
  .statgrid { display: flex; gap: 1.6rem; flex-wrap: wrap; align-items: start; }
  .stat { cursor: help; }
  .stat .n { font-size: 1.5rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
  .stat .s { color: var(--muted); font-size: 0.72rem; opacity: 0.8; margin-top: 0.1rem; }
  .scroll { overflow-x: auto; }
</style>
