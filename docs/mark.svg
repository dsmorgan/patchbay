      <rect x="1" y="19" width="30" height="8" rx="2.2"/>
    </g>
    <g fill="#12191b">
      <rect x="3" y="2.5" width="4" height="5" rx="1.1"/>
      <rect x="8.5" y="2.5" width="4" height="5" rx="1.1"/>
      <rect x="14" y="2.5" width="4" height="5" rx="1.1"/>
      <rect x="19.5" y="2.5" width="4" height="5" rx="1.1"/>
      <rect x="25" y="2.5" width="4" height="5" rx="1.1"/>
      <rect x="3" y="20.5" width="4" height="5" rx="1.1"/>
      <rect x="8.5" y="20.5" width="4" height="5" rx="1.1"/>
      <rect x="14" y="20.5" width="4" height="5" rx="1.1"/>
