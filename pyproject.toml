[project]
name = "patchbay"
# the version lives in src/patchbay/__init__.py alone — hatchling reads it
# from there, so a release bumps one file and pip metadata can't go stale
# (0.5.0 through 0.8.0 shipped with pip reporting 0.4.0)
dynamic = ["version"]
description = "Unified visual console for homelab networks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyvmomi>=8.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.111", "uvicorn>=0.30", "jinja2>=3.1"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[project.scripts]
patchbay = "patchbay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/patchbay/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/patchbay"]
