[project]
name = "patchbay"
version = "0.4.0"
description = "Unified visual console for homelab networks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyvmomi>=8.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.111", "uvicorn>=0.30", "jinja2>=3.1"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[project.scripts]
patchbay = "patchbay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchbay"]
